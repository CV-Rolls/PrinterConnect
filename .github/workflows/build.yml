name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:        # lets you start a build from the GitHub web UI on your phone

permissions:
  contents: write           # required so the job can attach files to a release
  id-token: write           # keyless cosign signing: GitHub vouches for this workflow, no keys stored anywhere

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Rename with version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content PrinterTool.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$v</Version> in PrinterTool.csproj"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item bin/Release/net48/PrinterConnect.exe        "dist/PrinterConnect-$v.exe"
          Copy-Item bin/Release/net48/PrinterConnect.exe.config "dist/PrinterConnect-$v.exe.config"
          $h = (Get-FileHash "dist/PrinterConnect-$v.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  PrinterConnect-$v.exe" | Set-Content -NoNewline -Encoding ascii "dist/PrinterConnect-$v.exe.sha256"
          Get-Content "dist/PrinterConnect-$v.exe.sha256"

      # Release builds (and manual test runs): sign the exe with Sigstore cosign (keyless). The signature
      # bundle proves the file was built by this repo's workflow from this tag, and is
      # recorded in the public Rekor transparency log. It does not replace Authenticode
      # (no effect on SmartScreen) — it lets anyone verify where the binary came from.
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@v3

      - name: Sign with cosign (keyless)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            cosign sign-blob --yes --bundle "$($_.FullName).sigstore.json" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "cosign signing failed for $($_.Name)" }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrinterConnect
          path: dist/*

      - name: Attach to release when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
