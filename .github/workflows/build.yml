name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:        # lets you start a build from the GitHub web UI on your phone

permissions:
  contents: write           # required so the job can attach files to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Rename with version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content PrinterTool.csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item bin/Release/net48/PrinterConnect.exe        "dist/PrinterConnect-$v.exe"
          Copy-Item bin/Release/net48/PrinterConnect.exe.config "dist/PrinterConnect-$v.exe.config"
          (Get-FileHash "dist/PrinterConnect-$v.exe" -Algorithm SHA256).Hash | Out-File "dist/PrinterConnect-$v.exe.sha256"
          Get-Content "dist/PrinterConnect-$v.exe.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrinterConnect
          path: dist/*

      - name: Attach to release when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
